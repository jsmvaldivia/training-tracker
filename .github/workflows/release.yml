# Release (issue #17): on a v* tag, run the full gate, build the linux/x86_64
# ReleaseSafe binary and the web bundle, push the container image to GHCR
# tagged with the version and latest, and attach the artifacts to a GitHub
# Release. The image is the same Dockerfile as `docker build .` locally.
#
# The image is built for linux/amd64 and linux/arm64 (issue #57): prod is the
# arm64 k3s cluster (docs/adr/0001-container-deployment.md). The Zig stage
# cross-compiles natively on the runner; only `bun install` in the runtime
# stage runs under QEMU for the arm64 half. If that step turns slow or flaky,
# move the arm64 half to an `ubuntu-24.04-arm` runner and merge the manifests.
#
# One-time setting, not automated: after the first tag, make the GHCR package
# public (github.com/users/jsmvaldivia/packages/container/training-tracker,
# Package settings, Danger Zone, Change visibility) so the cluster pulls it
# without a secret. Check the visibility after the first push; it may start
# private.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The same gates as the backend and frontend workflows; nothing ships on a
  # commit they would have failed.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Cache Zig build artifacts
        uses: actions/cache@v6
        with:
          path: api/.zig-cache
          key: zig-cache-${{ runner.os }}-${{ hashFiles('mise.toml', 'api/build.zig', 'api/build.zig.zon') }}
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: bun node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Run the gate
        run: scripts/gate.sh
        env:
          GATE_SKIP: e2e-live perf
          CI: "1"

  release:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Build the linux/x86_64 API binary
        working-directory: api
        run: zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe --prefix "$RUNNER_TEMP/api"

      # The web half the container runs: server, entry, sources, and the
      # locked manifest; `bun install --production && bun server.ts` serves it.
      - name: Bundle the web app
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$RUNNER_TEMP/api/bin/training-tracker" "$RUNNER_TEMP/dist/training-tracker-${{ github.ref_name }}-linux-x86_64"
          tar -czf "$RUNNER_TEMP/dist/training-tracker-web-${{ github.ref_name }}.tar.gz" \
            -C web server.ts index.html bunfig.toml tsconfig.json package.json bun.lock src
          ls -l "$RUNNER_TEMP/dist"

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ runner.temp }}/dist/*
          generate_release_notes: true

# Backend gate (issue #13): formatting and the full Zig suite on every push
# and PR to main that touches the API. Runs scripts/gate.sh so CI and the
# local gate cannot drift; the frontend-only steps are skipped here (they
# have their own workflow) and recorded as skipped in .gate/result.json.
name: backend

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "scripts/gate.sh"
      - "scripts/lib.sh"
      - "scripts/check-tools.sh"
      - "scripts/validate-oas.sh"
      - "mise.toml"
      - ".github/workflows/backend.yml"
      - ".github/actions/setup/**"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "scripts/gate.sh"
      - "scripts/lib.sh"
      - "scripts/check-tools.sh"
      - "scripts/validate-oas.sh"
      - "mise.toml"
      - ".github/workflows/backend.yml"
      - ".github/actions/setup/**"

permissions:
  contents: read

jobs:
  # The job id is the required-check context in the branch ruleset (#19).
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The gate's deps step installs Bun packages for the Spectral lint.
      - name: Run the backend gate
        run: scripts/gate.sh
        env:
          GATE_SKIP: unit-cov e2e e2e-live perf

      - name: Upload gate output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-gate
          path: .gate/
          if-no-files-found: ignore

# CodeQL for the TypeScript in web/ (Zig is not a CodeQL language): every
# push and PR to main, plus a weekly run. The branch ruleset's code-scanning
# rule reads this workflow's "Analyze (javascript-typescript)" result.
name: "CodeQL Advanced"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '44 23 * * 0'

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

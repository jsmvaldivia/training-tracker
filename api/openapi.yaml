openapi: 3.1.0
info:
  title: Training Tracker API
  version: 0.1.0
  description: >
    REST API for tracking trainings and certifications. This contract is the
    source of truth — the Zig backend owns it and the React frontend generates
    its typed client from it. Resources (Pursuit, Milestone) are added here
    first, then implemented against this spec.


    ## Conventions


    - **IDs** are server-assigned and monotonic, prefixed by resource type:
      pursuits are `p_<n>` and milestones are `m_<n>`. The counter is shared, so
      a pursuit created before its first milestone is `p_1` and that milestone is
      `m_2`.

    - **Timestamps** are ISO 8601 in UTC (e.g. `2026-06-19T14:30:00Z`).

    - **Read-only fields** (`id`, `completed_at`, `achieved_at`) are assigned by
      the server and ignored if sent in a request body.

    - **Errors** share a single `Error` shape: an HTTP `status`, a human-readable
      `message`, and optional `details`.
servers:
  - url: http://127.0.0.1:8080
    description: Local development

tags:
  - name: system
    description: Service-level operations (liveness, diagnostics).
  - name: pursuits
    description: Pursuit resource (trainings and certifications).
  - name: milestones
    description: Milestone resource (nested under pursuits).

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: Returns the service status; used to confirm the backend is up.
      tags: [system]
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok

  /pursuits:
    get:
      operationId: listPursuits
      summary: List all pursuits
      description: >
        Returns a paginated list of pursuits, optionally filtered by type.
        Supports filtering by certification or training type via query parameter.
      tags: [pursuits]
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PursuitType"
          description: Filter pursuits by type (certification or training).
          example: certification
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of pursuits to return (default 50, max 100).
          example: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of pursuits to skip for pagination (default 0).
          example: 0
      responses:
        "200":
          description: Paginated list of pursuits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PursuitsListResponse"
              example:
                data:
                  - id: p_1
                    name: AWS Certified Solutions Architect
                    type: certification
                    status: in_progress
                    description: Associate level certification for AWS cloud architecture.
                    target_date: "2026-12-31T23:59:59Z"
                    started_at: "2026-06-01T00:00:00Z"
                    expires_at: "2029-12-15T00:00:00Z"
                    tags: [cloud, aws, architecture]
                    milestones:
                      - id: m_2
                        name: Complete Cloud Practitioner exam
                        date: "2026-07-15T00:00:00Z"
                        state: achieved
                        achieved_at: "2026-07-10T14:30:00Z"
                  - id: p_3
                    name: Advanced TypeScript
                    type: training
                    status: planned
                    target_date: "2026-09-30T00:00:00Z"
                    started_at: "2026-06-15T00:00:00Z"
                    tags: [frontend, typescript]
                    milestones: []
                total: 2
                limit: 50
                offset: 0

    post:
      operationId: createPursuit
      summary: Create a new pursuit
      description: >
        Creates a new pursuit with the provided details. The server assigns
        a unique ID and auto-sets completed_at when status is 'completed'.
        Milestones can be created inline or added later.
      tags: [pursuits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PursuitCreate"
            examples:
              minimal:
                summary: Minimal — only required fields
                value:
                  name: Advanced TypeScript
                  type: training
                  target_date: "2026-09-30T00:00:00Z"
                  started_at: "2026-06-15T00:00:00Z"
              full:
                summary: Full — certification with tags and inline milestones
                value:
                  name: AWS Certified Solutions Architect
                  type: certification
                  status: in_progress
                  description: Associate level certification for AWS cloud architecture.
                  target_date: "2026-12-31T23:59:59Z"
                  started_at: "2026-06-01T00:00:00Z"
                  expires_at: "2029-12-15T00:00:00Z"
                  tags: [cloud, aws, architecture]
                  milestones:
                    - name: Complete Cloud Practitioner exam
                      date: "2026-07-15T00:00:00Z"
      responses:
        "201":
          description: Pursuit created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pursuit"
              example:
                id: p_1
                name: AWS Certified Solutions Architect
                type: certification
                status: in_progress
                description: Associate level certification for AWS cloud architecture.
                target_date: "2026-12-31T23:59:59Z"
                started_at: "2026-06-01T00:00:00Z"
                expires_at: "2029-12-15T00:00:00Z"
                tags: [cloud, aws, architecture]
                milestones:
                  - id: m_2
                    name: Complete Cloud Practitioner exam
                    date: "2026-07-15T00:00:00Z"
                    state: pending
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 400
                message: Invalid request body
                details: "Field 'name' is required"

  /pursuits/{id}:
    get:
      operationId: getPursuit
      summary: Get a single pursuit
      description: >
        Returns a single pursuit by ID, including all nested milestones.
      tags: [pursuits]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique pursuit identifier.
          example: p_1
      responses:
        "200":
          description: Pursuit found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pursuit"
              example:
                id: p_1
                name: AWS Certified Solutions Architect
                type: certification
                status: in_progress
                description: Associate level certification for AWS cloud architecture.
                target_date: "2026-12-31T23:59:59Z"
                started_at: "2026-06-01T00:00:00Z"
                expires_at: "2029-12-15T00:00:00Z"
                tags: [cloud, aws, architecture]
                milestones:
                  - id: m_2
                    name: Complete Cloud Practitioner exam
                    date: "2026-07-15T00:00:00Z"
                    state: achieved
                    achieved_at: "2026-07-10T14:30:00Z"
        "404":
          description: Pursuit not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 404
                message: Pursuit not found

    patch:
      operationId: updatePursuit
      summary: Update a pursuit
      description: >
        Partially updates a pursuit. All fields are optional. The server
        automatically sets completed_at when status changes to 'completed'.
        Read-only fields (id, completed_at) are ignored if sent.
      tags: [pursuits]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique pursuit identifier.
          example: p_1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PursuitUpdate"
            examples:
              markComplete:
                summary: Mark as completed (server stamps completed_at)
                value:
                  status: completed
              rename:
                summary: Rename and retag
                value:
                  name: AWS Certified Solutions Architect — Associate
                  tags: [cloud, aws, architecture, exam-2026]
      responses:
        "200":
          description: Pursuit updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pursuit"
              example:
                id: p_1
                name: AWS Certified Solutions Architect
                type: certification
                status: completed
                description: Associate level certification for AWS cloud architecture.
                target_date: "2026-12-31T23:59:59Z"
                started_at: "2026-06-01T00:00:00Z"
                completed_at: "2026-12-15T10:30:00Z"
                expires_at: "2029-12-15T00:00:00Z"
                tags: [cloud, aws, architecture]
                milestones: []
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 400
                message: Invalid request body
                details: "Field 'status' must be one of: planned, in_progress, completed, expired"
        "404":
          description: Pursuit not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 404
                message: Pursuit not found

    delete:
      operationId: deletePursuit
      summary: Delete a pursuit
      description: >
        Permanently deletes a pursuit and all its milestones.
      tags: [pursuits]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique pursuit identifier.
          example: p_1
      responses:
        "204":
          description: Pursuit deleted successfully
        "404":
          description: Pursuit not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 404
                message: Pursuit not found

  /pursuits/{id}/milestones:
    post:
      operationId: createMilestone
      summary: Add a milestone to a pursuit
      description: >
        Creates a new milestone for the specified pursuit. The server assigns
        a unique ID and auto-sets achieved_at when state is 'achieved'.
      tags: [milestones]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique pursuit identifier.
          example: p_1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneCreate"
            example:
              name: Complete Cloud Practitioner exam
              date: "2026-07-15T00:00:00Z"
      responses:
        "201":
          description: Milestone created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
              example:
                id: m_2
                name: Complete Cloud Practitioner exam
                date: "2026-07-15T00:00:00Z"
                state: pending
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 400
                message: Invalid request body
                details: "Field 'date' is required"
        "404":
          description: Pursuit not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 404
                message: Pursuit not found

  /pursuits/{id}/milestones/{milestoneId}:
    patch:
      operationId: updateMilestone
      summary: Update a milestone
      description: >
        Updates a milestone's state or date. The server automatically sets
        achieved_at when state changes to 'achieved'. Toggling state from
        'achieved' to 'pending' clears achieved_at.
      tags: [milestones]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique pursuit identifier.
          example: p_1
        - name: milestoneId
          in: path
          required: true
          schema:
            type: string
          description: Unique milestone identifier.
          example: m_2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneUpdate"
            examples:
              markAchieved:
                summary: Mark as achieved (server stamps achieved_at)
                value:
                  state: achieved
              reschedule:
                summary: Move the target date
                value:
                  date: "2026-08-01T00:00:00Z"
      responses:
        "200":
          description: Milestone updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
              example:
                id: m_2
                name: Complete Cloud Practitioner exam
                date: "2026-07-15T00:00:00Z"
                state: achieved
                achieved_at: "2026-07-10T14:30:00Z"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 400
                message: Invalid request body
                details: "Field 'state' must be one of: pending, achieved"
        "404":
          description: Pursuit or milestone not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 404
                message: Milestone not found
    delete:
      operationId: deleteMilestone
      summary: Delete a milestone
      description: >
        Permanently removes a milestone from a pursuit.
      tags: [milestones]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique pursuit identifier.
          example: p_1
        - name: milestoneId
          in: path
          required: true
          schema:
            type: string
          description: Unique milestone identifier.
          example: m_2
      responses:
        "204":
          description: Milestone deleted successfully
        "404":
          description: Pursuit or milestone not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 404
                message: Milestone not found

components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          description: Liveness indicator; always 'ok' when the service responds.
          example: ok

    Status:
      type: string
      enum: [planned, in_progress, completed, expired]
      description: >
        Pursuit lifecycle status. Transitions: planned → in_progress → completed.
        Certifications may also transition to expired after their validity period.

    PursuitType:
      type: string
      enum: [certification, training]
      description: Type of pursuit (training or certification).

    MilestoneState:
      type: string
      enum: [pending, achieved]
      description: Milestone completion state.

    MilestoneCreate:
      type: object
      required: [name, date]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Milestone name or description.
          example: "Complete Cloud Practitioner exam"
        date:
          type: string
          format: date-time
          description: Target date for this milestone (ISO 8601).
          example: "2026-07-15T00:00:00Z"
        state:
          $ref: "#/components/schemas/MilestoneState"
          default: pending
          description: Initial state (defaults to 'pending' if not provided).
      example:
        name: Complete Cloud Practitioner exam
        date: "2026-07-15T00:00:00Z"

    MilestoneUpdate:
      type: object
      description: >
        Partial update for a milestone. All fields optional. The server auto-sets
        achieved_at when state changes to 'achieved', and clears it when state
        changes back to 'pending'.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Milestone name or description.
          example: "Complete Cloud Practitioner exam"
        date:
          type: string
          format: date-time
          description: Target date for this milestone (ISO 8601).
          example: "2026-07-15T00:00:00Z"
        state:
          $ref: "#/components/schemas/MilestoneState"
          description: New milestone state.
      example:
        state: achieved

    Milestone:
      type: object
      required: [id, name, date, state]
      properties:
        id:
          type: string
          pattern: "^[a-zA-Z0-9_-]+$"
          description: Unique milestone identifier (server-assigned).
          example: "m_2"
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Milestone name or description.
          example: "Complete Cloud Practitioner exam"
        date:
          type: string
          format: date-time
          description: Target date for this milestone (ISO 8601).
          example: "2026-07-15T00:00:00Z"
        state:
          $ref: "#/components/schemas/MilestoneState"
        achieved_at:
          type: string
          format: date-time
          description: >
            Timestamp when milestone was achieved (ISO 8601). Auto-set by server
            when state changes to 'achieved'. Read-only.
          example: "2026-07-10T14:30:00Z"
      example:
        id: m_2
        name: Complete Cloud Practitioner exam
        date: "2026-07-15T00:00:00Z"
        state: achieved
        achieved_at: "2026-07-10T14:30:00Z"

    Pursuit:
      type: object
      required: [id, name, type, status, target_date, started_at, tags, milestones]
      properties:
        id:
          type: string
          pattern: "^[a-zA-Z0-9_-]+$"
          description: Unique pursuit identifier (server-assigned).
          example: "p_1"
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Pursuit name.
          example: "AWS Certified Solutions Architect"
        type:
          $ref: "#/components/schemas/PursuitType"
        status:
          $ref: "#/components/schemas/Status"
        description:
          type: string
          maxLength: 2000
          description: Optional notes or description.
          example: "Associate level certification for AWS cloud architecture."
        target_date:
          type: string
          format: date-time
          description: Target completion date (ISO 8601).
          example: "2026-12-31T23:59:59Z"
        started_at:
          type: string
          format: date-time
          description: Date when pursuit was started (ISO 8601).
          example: "2026-06-01T00:00:00Z"
        completed_at:
          type: string
          format: date-time
          description: >
            Completion timestamp (ISO 8601). Auto-set by server when status
            changes to 'completed'. Read-only.
          example: "2026-12-15T10:30:00Z"
        expires_at:
          type: string
          format: date-time
          description: >
            Expiration date for certifications (ISO 8601). Optional, typically
            only set for type=certification.
          example: "2029-12-15T00:00:00Z"
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 20
          description: Tags for categorization and filtering.
          example: ["cloud", "aws", "architecture"]
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"
          maxItems: 50
          description: Milestones associated with this pursuit.
      example:
        id: p_1
        name: AWS Certified Solutions Architect
        type: certification
        status: in_progress
        description: Associate level certification for AWS cloud architecture.
        target_date: "2026-12-31T23:59:59Z"
        started_at: "2026-06-01T00:00:00Z"
        expires_at: "2029-12-15T00:00:00Z"
        tags: [cloud, aws, architecture]
        milestones:
          - id: m_2
            name: Complete Cloud Practitioner exam
            date: "2026-07-15T00:00:00Z"
            state: achieved
            achieved_at: "2026-07-10T14:30:00Z"

    PursuitCreate:
      type: object
      required: [name, type, target_date, started_at]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Pursuit name.
          example: "AWS Certified Solutions Architect"
        type:
          $ref: "#/components/schemas/PursuitType"
        status:
          $ref: "#/components/schemas/Status"
          default: planned
          description: Initial status (defaults to 'planned' if not provided).
        description:
          type: string
          maxLength: 2000
          description: Optional notes or description.
          example: "Associate level certification for AWS cloud architecture."
        target_date:
          type: string
          format: date-time
          description: Target completion date (ISO 8601).
          example: "2026-12-31T23:59:59Z"
        started_at:
          type: string
          format: date-time
          description: Date when pursuit was started (ISO 8601).
          example: "2026-06-01T00:00:00Z"
        expires_at:
          type: string
          format: date-time
          description: >
            Expiration date for certifications (ISO 8601). Optional, typically
            only set for type=certification.
          example: "2029-12-15T00:00:00Z"
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 20
          default: []
          description: Tags for categorization and filtering.
          example: ["cloud", "aws", "architecture"]
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/MilestoneCreate"
          maxItems: 50
          default: []
          description: Initial milestones to create with this pursuit.
      example:
        name: AWS Certified Solutions Architect
        type: certification
        target_date: "2026-12-31T23:59:59Z"
        started_at: "2026-06-01T00:00:00Z"
        tags: [cloud, aws, architecture]
        milestones:
          - name: Complete Cloud Practitioner exam
            date: "2026-07-15T00:00:00Z"

    PursuitUpdate:
      type: object
      description: >
        Partial update for a pursuit. All fields optional. Server auto-sets
        completed_at when status changes to 'completed'.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        type:
          $ref: "#/components/schemas/PursuitType"
        status:
          $ref: "#/components/schemas/Status"
        description:
          type: string
          maxLength: 2000
        target_date:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 20
      example:
        status: completed

    PursuitsListResponse:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Pursuit"
          description: Array of pursuits for the current page.
        total:
          type: integer
          minimum: 0
          description: Total number of pursuits matching the filter.
          example: 42
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of items returned in this response.
          example: 50
        offset:
          type: integer
          minimum: 0
          description: Number of items skipped before this page.
          example: 0

    Error:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
          description: HTTP status code.
          example: 404
        message:
          type: string
          description: Human-readable error message.
          example: "Pursuit not found"
        details:
          type: string
          description: Optional detailed error information.
          example: "No pursuit exists with id 'p_1'"
      example:
        status: 404
        message: Pursuit not found
